description = "A more complete version of Team Infamous's unreleased ancient mobs."
authors = ["Fireox Salesman"]
contributors = []
inception_year = "2026"
license.name = "MIT"
license.url = "https://opensource.org/licenses/MIT"
license.dist = "repo"
environment = "client_and_server"
sources_url = "https://github.com/firefoxsalesman/DungeonsLibs"
homepage_url = "https://github.com/firefoxsalesman/DungeonsLibs"
issues_url = "https://github.com/firefoxsalesman/DungeonsLibs/issues"
dev_jvm_args = ["-XX:+IgnoreUnrecognizedVMOptions", "-XX:+UseZGC", "-XX:+HeapDumpOnOutOfMemoryError", "-XX:HeapDumpPath=heapdump.hprof", "-XX:+ShowCodeDetailsInExceptionMessages", "-XX:+UseCompactObjectHeaders", "-XX:+AlwaysPreTouch", "-XX:+UseStringDeduplication", "-Dfile.encoding=UTF-8"]
